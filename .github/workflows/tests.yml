name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lower bound and current, so a pandas deprecation shows up here
        # rather than in a notebook six months later.
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        # The data and feature layer is what CI covers. TensorFlow and the
        # dashboard stack are not needed for it and cost several minutes.
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.2,<3.2" "numpy>=1.26,<3.0" "scikit-learn>=1.4,<2.0" "pytest>=8.0,<9.0"

      - name: Run tests
        run: python -m pytest -q
