[pytest]
testpaths = tests

markers =
    slow: needs trained artifacts and takes a while (dashboard rendering)

# Deprecations in our own code are errors: the pandas 2.2 groupby.fillna
# removal broke the feature pipeline for two releases while printing a warning
# into a notebook nobody read.
#
# Deprecations raised inside third party packages are not ours to fix and would
# just pin the suite to one version of lifelines, so those are ignored by module.
# Later filters win, so the ignores must come after the errors.
filterwarnings =
    error::FutureWarning
    error::DeprecationWarning
    error::pandas.errors.PerformanceWarning
    ignore::DeprecationWarning:lifelines.*
    ignore::DeprecationWarning:formulaic.*
    ignore::FutureWarning:lifelines.*
